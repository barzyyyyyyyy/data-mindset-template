<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- The course's up-to-date copy of this page (see core/central.js). -->
<script src="https://asafbarzilay-web.github.io/data-mindset-template/core/central.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Data</title>
<!-- Copies the setup (copy.html?f=setup) or a lesson's practice data (copy.html?f=lesson-02) in one click.
     Selecting it by hand in a file viewer often copies only the part on screen. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../core/course-config.js"></script>
<script src="../core/course.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F4F4F2; color: #1C1C1A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 60px; }
  .back { font-size: 14px; color: #6B6B66; text-decoration: none; }
  .card { background: #fff; border: 1px solid #E2E2DE; border-radius: 14px; padding: 24px 26px; margin-top: 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .muted { color: #6B6B66; font-size: 14px; line-height: 1.55; }
  button { font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 12px 20px; border: none; background: #1C1C1A; color: #fff; margin: 16px 0 6px; }
  button:disabled { opacity: .5; cursor: default; }
  .ok { color: #1F7A3F; font-weight: 600; font-size: 14px; }
  .bad { color: #B42318; font-size: 14px; }
  ol { padding-left: 20px; margin: 18px 0 0; font-size: 15px; line-height: 1.7; }
  table { border-collapse: collapse; margin: 10px 0 0; font-size: 14px; }
  td { padding: 5px 14px 5px 0; border-bottom: 1px solid #EEEEEA; }
  td:first-child { font-family: ui-monospace, Menlo, monospace; }
  td:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← Your study platform</a>
  <div class="card">
    <h1 id="title">Practice data</h1>
    <p class="muted" id="size">Loading…</p>
    <button id="copy" disabled>Copy the practice data</button>
    <div id="status"></div>
    <ol>
      <li>In Supabase, open <b>SQL Editor → New query</b>.</li>
      <li>Paste (⌘V) and press <b>Run</b>. Confirm if it warns about deleting: it replaces only practice data.</li>
      <li>Check the result against these numbers. If they differ, the paste was incomplete:</li>
    </ol>
    <table id="expect"></table>
  </div>
</div>
<script>
  const f = (new URLSearchParams(location.search).get('f') || '').replace(/[^a-z0-9-]/g, '');
  let sql = '';
  document.getElementById('title').textContent = `Practice data · ${f}`;
  // `setup` is the one-time database setup; everything else is a lesson's practice data.
  const isSetup = f === 'setup';
  if (isSetup) { document.getElementById('title').textContent = 'Database setup'; document.title = 'Database Setup'; }
  // Practice data is made for this team by the course server; the setup is the same for everyone.
  (isSetup ? fetch('../setup.sql', { cache: 'no-store' }).then(r => r.text()) : Course.data(f))
    .then(text => {
      sql = text;
      // Rows per table, counted from the file itself: what Run should report.
      const rows = {}; let t = null;
      for (const line of text.split('\n')) {
        const m = line.match(/^insert into public\.(\w+)/);
        if (m) t = m[1]; else if (t && line.startsWith('(')) rows[t] = (rows[t] || 0) + 1;
      }
      document.getElementById('size').textContent = `${text.split('\n').length.toLocaleString()} lines. Too long to select by hand: use the button.`;
      document.getElementById('expect').innerHTML = ['sessions', 'clicks', 'selections', 'identities']
        .map(k => `<tr><td>${k}</td><td>${(rows[k] || 0).toLocaleString()}</td></tr>`).join('');
      if (isSetup) {
        document.getElementById('expect').innerHTML = '';
        document.getElementById('copy').textContent = 'Copy the setup';
        const li = document.querySelectorAll('ol li');
        li[1].innerHTML = 'Paste (⌘V) and press <b>Run</b>. If it warns about destructive operations, confirm: the setup only creates what is missing.';
        li[2].textContent = 'The result lists four tables: sessions, clicks, selections, identities.';
      }
      document.getElementById('copy').disabled = false;
    })
    .catch(e => { document.getElementById('size').innerHTML = `<span class="bad">${e.message}</span>`; });
  document.getElementById('copy').addEventListener('click', async () => {
    const out = document.getElementById('status');
    try {
      await navigator.clipboard.writeText(sql);
      out.innerHTML = '<span class="ok">Copied, all of it. Now paste it into Supabase.</span>';
    } catch (e) {
      out.innerHTML = '<span class="bad">Your browser blocked the copy. Try again, or use another browser.</span>';
    }
  });
</script>
</body>
</html>
